<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Game RTS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 顶部 HUD -->
  <div id="hud-top" class="hud-top">
    <div class="hud-group">
      <span class="hud-icon gold-icon">🪙</span>
      <span id="hud-gold" class="hud-value">300</span>
      <span id="hud-gold-rate" class="hud-sub">(+5/s)</span>
    </div>
    <div class="hud-group">
      <span class="hud-icon wood-icon">🪵</span>
      <span id="hud-wood" class="hud-value">0</span>
      <span id="hud-wood-rate" class="hud-sub">(+0/s)</span>
    </div>
    <div class="hud-group">
      <span class="hud-icon stone-icon">🪨</span>
      <span id="hud-stone" class="hud-value">0</span>
      <span id="hud-stone-rate" class="hud-sub">(+0/s)</span>
    </div>
    <div class="hud-group">
      <span class="hud-icon pop-icon">👥</span>
      <span id="hud-pop" class="hud-value">0</span>
      <span class="hud-sub">/100</span>
    </div>
    <div class="hud-group">
      <span class="hud-icon time-icon">⏱️</span>
      <span id="hud-time" class="hud-value">00:00</span>
    </div>
    <div class="hud-group hud-spacer"></div>
    <div class="hud-group">
      <span id="hud-ai-source" class="hud-ai-source">AI：规则</span>
    </div>
    <button id="hud-ai-takeover" class="hud-ai-takeover" title="将玩家部队指挥权交给 AI（再点一次交还）">🤖 AI接管</button>
  </div>

  <!-- 选中单位信息 -->
  <div id="selection-panel" class="selection-panel hidden">
    <div id="selection-title" class="selection-title">已选 0 单位</div>
    <div id="selection-detail" class="selection-detail"></div>
    <div class="selection-hint">右键移动 · A+左键攻击移动 · 右键敌方攻击 · Esc 取消</div>
  </div>

  <!-- 底部生产面板（按钮由 ui.js 根据单位注册表动态生成） -->
  <div id="production-panel" class="production-panel">
    <div id="production-buttons" class="production-buttons"></div>
    <div id="queue-display" class="queue-display"></div>
  </div>

  <!-- 科技升级面板 -->
  <div id="upgrade-panel" class="upgrade-panel">
    <div class="upgrade-title">⚒️ 科技升级</div>
    <button class="upg-btn" data-track="attack">
      <span class="upg-icon">⚔️</span>
      <span class="upg-name">军备锻造</span>
      <span class="upg-desc"></span>
      <span class="upg-level">0/3</span>
      <span class="upg-cost">🪵100</span>
    </button>
    <button class="upg-btn" data-track="armor">
      <span class="upg-icon">🛡️</span>
      <span class="upg-name">铁甲研究</span>
      <span class="upg-desc"></span>
      <span class="upg-level">0/3</span>
      <span class="upg-cost">🪵80</span>
    </button>
    <button class="upg-btn" data-track="defense">
      <span class="upg-icon">🏰</span>
      <span class="upg-name">城防工事</span>
      <span class="upg-desc"></span>
      <span class="upg-level">0/3</span>
      <span class="upg-cost">🪨120</span>
    </button>
  </div>

  <!-- 小地图 -->
  <div id="minimap-wrap" class="minimap-wrap">
    <canvas id="minimap" width="180" height="180"></canvas>
  </div>

  <!-- 提示 toast -->
  <div id="toasts" class="toasts"></div>

  <!-- AI 决策消息（左=玩家蓝，右=敌方红，常驻最多 5 条） -->
  <div id="ai-msg-player" class="ai-messages"></div>
  <div id="ai-msg-enemy" class="ai-messages"></div>

  <!-- 主菜单（选择地图） -->
  <div id="menu" class="menu">
    <div class="menu-box">
      <h1 class="menu-title">DeepSeek Game RTS</h1>
      <div class="menu-sub">选择双方 AI 大模型与地图，开始对局</div>
      <div class="menu-ai-row">
        <label class="menu-ai-label">玩家 AI</label>
        <select id="ai-provider-player" class="menu-ai-select">
          <option value="deepseek" selected>DeepSeek</option>
          <option value="doubao">豆包</option>
        </select>
        <label class="menu-ai-label">敌方 AI</label>
        <select id="ai-provider-enemy" class="menu-ai-select">
          <option value="deepseek" selected>DeepSeek</option>
          <option value="doubao">豆包</option>
        </select>
      </div>
      <label class="menu-check-row" title="开局后玩家部队立即交由 AI 指挥（游戏内可随时点顶部按钮交还）">
        <input type="checkbox" id="menu-ai-takeover" />
        <span>开局即由 AI 接管玩家部队</span>
      </label>
      <div id="map-list" class="map-list"></div>
      <button id="menu-start" class="menu-btn">开始游戏</button>
    </div>
  </div>

  <!-- 结束覆盖层 -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-box">
      <div id="overlay-title" class="overlay-title">胜利</div>
      <div id="overlay-sub" class="overlay-sub"></div>
      <div class="overlay-btns">
        <button id="overlay-restart" class="overlay-btn">再来一局</button>
        <button id="overlay-menu" class="overlay-btn secondary">主菜单</button>
      </div>
    </div>
  </div>

  <div id="debug-panel" class="debug-panel hidden"></div>

  <!--
    模块加载顺序：
    config → registry → units/* → maps/* → world → pathfinding → camera → unit
    → combat → production → resources → projectiles → ai → input → render → ui → main

    ★ 新增单位：在 js/units/ 下加一个定义文件，并在此加一行 <script>（顺序在 maps/* 之后、world 之前任意）。
    ★ 新增地图：在 js/maps/ 下加一个定义文件，并在此加一行 <script>。
  -->
  <script src="js/config.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/units/spear.js"></script>
  <script src="js/units/sword.js"></script>
  <script src="js/units/archer.js"></script>
  <script src="js/units/crossbow.js"></script>
  <script src="js/units/cavalry.js"></script>
  <script src="js/maps/valley_river.js"></script>
  <script src="js/maps/wide_river.js"></script>
  <script src="js/world.js"></script>
  <script src="js/pathfinding.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/unit.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/production.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/projectiles.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/input.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
